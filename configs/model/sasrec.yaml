model: sasrec
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
hidden_act: gelu
max_seq_length: 50
initializer_range: 0.02
loss: ce
full_softmax: true
optim:
  lr: 0.001
  weight_decay: 0.0
  batch_size: 256
  epochs: 200       # upper bound; early stop decides
  patience: 20      # early stop on valid ndcg@10 (full-data baseline setting)
  num_workers: 0
seed: 42
device: auto  # cuda if available else cpu
threads: null  # torch.set_num_threads; CPU: 4 fastest for 1 run, 3+3 for 2 parallel runs on 8 cores
max_users: null  # set e.g. 1000 for smoke
debug_subset: false
early_stop_metric: ndcg@10
checkpoint_dir: /workspace/pcdrec/results/checkpoints
results_dir: /workspace/pcdrec/results
