model: bert4rec
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
mask_ratio: 0.2           # Cloze masking probability (RecBole default)
max_seq_length: 50        # eval input = last 49 history items + [MASK]
initializer_range: 0.02
loss: ce                  # full-catalogue CE at masked positions
optim:
  lr: 0.001
  weight_decay: 0.0
  batch_size: 256
  epochs: 200
  patience: 20
  num_workers: 0
seed: 42
device: auto
threads: null
max_users: null
checkpoint_dir: results/checkpoints
results_dir: results
