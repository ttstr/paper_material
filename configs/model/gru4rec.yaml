model: gru4rec
hidden_size: 64          # item embedding / output dim (same d as SASRec)
gru_hidden: 64           # GRU hidden size (same capacity as SASRec d)
n_layers: 1
hidden_dropout_prob: 0.3 # embedding dropout (searched, see configs/search/baselines.yaml)
max_seq_length: 50
loss: ce
full_softmax: true
optim:
  lr: 0.001
  weight_decay: 0.0
  batch_size: 256
  epochs: 200
  patience: 20
  num_workers: 0
seed: 42
device: auto
threads: null
max_users: null
checkpoint_dir: results/checkpoints
results_dir: results
