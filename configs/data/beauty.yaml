dataset: beauty
# Paths are relative to the repository root (absolute paths also accepted).
# Override the raw data location with the environment variable PCDREC_DATA_DIR,
# and the processed cache with PCDREC_PROCESSED_DIR.
# Rebuild raw data from the official source: bash scripts/00_build_beauty_from_raw.sh
raw_dir: data/raw/amazon-beauty
manifest: data/raw/amazon-beauty/manifest.json
processed_dir: data/processed/beauty
text_fields:
  - title
  - categories
  - brand
holdout_h: 3
max_len: 50
split_mode: loo
eval:
  Ks: [5, 10, 20]
  full_rank: true
  sampled100: false
